<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Page not found - IT Technologies.">
    <title>404 - Page Not Found | IT Technologies</title>
    <link rel="icon" type="image/webp" href="images/logo.webp">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-404">

    <!-- ================= 404 Content ================= -->
    <div class="error-content">
        <div class="auth-form-wrapper">
            <div class="error-code">404</div>
            <h1>Oops! Page Not Found</h1>
            <p>The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
            <div class="error-buttons">
                <a href="index.html" class="btn btn-primary btn-large">Go Back Home</a>
                <button type="button" class="btn btn-secondary btn-large" onclick="history.back()">Back</button>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
